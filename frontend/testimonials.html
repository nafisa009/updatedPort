<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Testimonials — Nafisa Nasrin</title>
<meta name="description" content="Read and leave feedback for Nafisa Nasrin in her public guestbook.">
<meta property="og:title" content="Testimonials — Nafisa Nasrin">
<meta property="og:description" content="Read and leave feedback for Nafisa Nasrin in her public guestbook.">
<meta property="og:type" content="website">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app-header"></div>

<header class="page-hero">
  <p class="page-eyebrow">05 — Voices of the Crew</p>
  <h1 class="page-title">Testimonials</h1>
  <p class="page-lead">Feedback from mentors, teammates, and visitors — this is a public guestbook, so anyone who visits can read what's posted here.</p>
</header>

<section class="section">
  <form class="guestbook-form" id="guestbookForm">
    <div class="form-row-inline">
      <div class="form-row">
        <label for="gbName">Your Name</label>
        <input type="text" id="gbName" name="gbName" maxlength="60" required>
      </div>
    </div>
    <div class="form-row">
      <label for="gbMessage">Your Message</label>
      <textarea id="gbMessage" name="gbMessage" rows="4" maxlength="600" required></textarea>
    </div>
    <!-- honeypot field — invisible to humans, bots tend to fill every field -->
    <div class="form-row hp-field" aria-hidden="true">
      <label for="gbWebsite">Website</label>
      <input type="text" id="gbWebsite" name="gbWebsite" tabindex="-1" autocomplete="off">
    </div>
    <button type="submit" class="btn btn-primary full-width">Post Message</button>
    <p class="form-note" id="guestbookNote"></p>
  </form>

  <p class="guestbook-status" id="guestbookStatus"></p>
  <div class="guestbook-list" id="guestbookList">
    <p class="guestbook-empty">Loading messages…</p>
  </div>
</section>

<div id="app-footer"></div>

<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/chatbot.js"></script>
<script src="js/comments.js"></script>
</body>
</html>
